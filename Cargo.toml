[package]
name = "pdf_standardizer"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.32"
egui_extras = "0.32"
rfd = { version = "0.15", default-features = false, features = ["file-handle-inner"] }
regex = "1"
lopdf = "0.34"
strsim = "0.11"
walkdir = "2"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
